# Fantasy power rankings configuration.
# The LEAGUE_ID environment variable overrides league_id when set.

# Your Sleeper league ID: open the league in the Sleeper web app; it's the number
# in the URL (https://sleeper.com/leagues/<LEAGUE_ID>/...).
league_id: "1330718400535592960"

# Power-score weights. They are applied to z-scores, so they don't have to sum
# to 1, but keeping them as percentages makes them easy to reason about.
weights:
  pf: 0.30          # points for per game
  max_pf: 0.25      # optimal-lineup points per game
  win_pct: 0.25     # win percentage (median games included)
  efficiency: 0.15  # PF / Max PF
  recent_form: 0.05 # exponentially decayed PF

# Recent form weight = decay ** weeks_ago
decay: 0.85

# Best waiver pickups (Awards tab) are ranked by
#   points x all points scored while on the team + started x points scored in the starting lineup
pickup_weights:
  points: 0.7
  started: 0.3

# Monte Carlo playoff simulation
simulations: 10000
random_seed: 42

# How many seasons to follow back through previous_league_id for all-time
# records and head-to-head (0 = current season only).
history_seasons: 10

# Movement write-ups (needs ANTHROPIC_API_KEY; otherwise template blurbs are used)
blurbs:
  model: claude-opus-5-5
  effort: medium
  # Generate AI blurbs for every week ("all") or only the latest week ("latest").
  # Blurbs are cached, so "all" only costs extra on the first run.
  weeks: all

# Future Rankings tab: 3-year dynasty outlook. Formulas are documented in CLAUDE.md.
dynasty:
  # Combined Dynasty score = weighted average of the Year 1/2/3 team scores.
  year_weights: [0.5, 0.3, 0.2]
  # Baseline points per game: each game counts recency_decay ** games_ago, over the
  # current and previous season. prior_games pseudo-games at the position's
  # replacement level keep small samples (and rookies with no games) in check.
  recency_decay: 0.9
  prior_games: 2
  # Young players (age <= young_age or years_exp <= young_years_exp) blend points
  # with snap share and opportunity volume (QBs: points + snaps only).
  young_age: 25
  young_years_exp: 3
  blend: { points: 0.6, snaps: 0.2, opportunity: 0.2 }
  qb_blend: { points: 0.8, snaps: 0.2 }
  snap_trend_weight: 0.5     # adjusted snap share = level + weight * (last 3 games - previous 3 games)
  rb_rush_weight: 0.5        # one RB carry counts as this many targets of opportunity
  # Opportunity adjustments (fractions of the projection; summed, then clamped).
  opportunity:
    behind_aging_starter: 0.15   # backup (depth order 2) behind a starter at or past his age cliff
    behind_injured_starter: 0.10 # backup behind a starter who is Out/IR/PUP/Doubtful/Suspended
    behind_young_starter: -0.10  # backup behind an entrenched starter (age <= 26, snap share >= 65%)
    snap_trend: 0.5              # x (last-3 minus previous-3 snap share), capped at +/- snap_trend_cap
    snap_trend_cap: 0.10
    max_total: 0.25              # overall opportunity adjustment is clamped to +/- this
    year_ramp: [0.5, 1.0, 1.0]   # share of the adjustment applied in Year 1/2/3
    rising_threshold: 0.05       # young players at or above this adjustment are flagged "rising"
  # Age curves: grow until peak_age, flat until cliff_age, then decline each year.
  # The multiplier compounds year over year from the player's current age.
  age_curves:
    RB: { growth: 0.06, peak_age: 24, cliff_age: 27, decline: 0.15 }
    WR: { growth: 0.05, peak_age: 25, cliff_age: 29, decline: 0.10 }
    TE: { growth: 0.07, peak_age: 26, cliff_age: 30, decline: 0.10 }
    QB: { growth: 0.04, peak_age: 27, cliff_age: 33, decline: 0.07 }
  no_team_factor: 0.25       # players without an NFL team (free agents, retired)
  # Future draft picks: projected points per game added to a team's score in the
  # pick's season and every later projected season.
  pick_values: { 1: 4.0, 2: 1.5, 3: 0.5 }

# Trades tab: how trades are labeled and valued. Formulas are documented in CLAUDE.md.
trades:
  # Trades more than preseason_days before week 1 are labeled "Preseason <season>".
  # Week 1's start comes from Sleeper (current season); list other seasons here,
  # otherwise the Thursday after Labor Day is used.
  preseason_days: 7
  week1_dates: { "2025": "2025-09-04" }
  # Verdicts need at least this many started player-weeks (both sides combined).
  min_started_weeks: 4
  # Trade tree: when a flip mixes tree assets with other assets, the return is split
  # by each outgoing asset's points above replacement over this many prior weeks.
  recent_par_weeks: 4
  # Weekly replacement level = score of the first player outside the starter pool:
  # dedicated slots x teams, plus each flex slot's share by league-wide usage
  # ("season" = that season's usage, "week" = that week's), times pool_scale.
  replacement:
    flex_usage: season
    pool_scale: 1.0

# Team pages: upcoming games' projected scores and win probability. Formulas in CLAUDE.md.
win_prob:
  waiver_rank: 3            # a slot nobody on the roster can fill well uses the Nth best free agent
  manager_prior_weeks: 4    # pseudo-weeks shrinking each manager's factor toward average
  ir_weeks: 4               # IR / PUP / suspended players count 0 for this many upcoming games
  injury_next_game: { Out: 0.0, Doubtful: 0.25, Questionable: 0.9 }  # next game only
  min_sd: 12.0              # floor on a team's weekly score SD
